<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sylepse</title>
<meta name="description" content="App web PWA pour identifier en temps réel l'avion que tu entends. Géolocalisation automatique, scan ADS-B, résultat en 3 secondes.">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Leaflet.js pour la Carte Radar Intégrée -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
/* ═══════════════════════════════════════════════════════
   Sylepse 4.0 — Zero-Bug Stacking Context & Tabular Numerics
   ═══════════════════════════════════════════════════════ */

:root {
  --bg:           #07080a;
  --bg-elevated:  #0e1014;
  --bg-card:      #111318;
  --bg-card-h:    #161920;
  --surface:      rgba(255,255,255,0.04);
  --surface-h:    rgba(255,255,255,0.08);
  --border:       rgba(255,255,255,0.08);
  --border-h:     rgba(255,255,255,0.16);

  --text:         #f0f2f5;
  --text-2:       #9ca3af;
  --text-3:       #6b7280;
  --text-4:       #374151;

  --accent:       #5eead4;
  --accent-dark:  #0d9488;
  --accent-g:     rgba(94,234,212,0.1);
  --accent-glow:  rgba(94,234,212,0.25);

  --green:        #34d399;
  --green-bg:     rgba(52,211,153,0.1);
  --yellow:       #fbbf24;
  --yellow-bg:    rgba(251,191,36,0.1);
  --orange:       #fb923c;
  --orange-bg:    rgba(251,146,60,0.1);
  --red:          #f87171;

  --sans:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', Consolas, monospace;

  --radius:       16px;
  --radius-sm:    10px;
  --radius-xs:    6px;

  --ease:         cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

body::before {
  content: '';
  position: fixed;
  top: -20vh; left: 50%;
  width: 140vw; height: 60vh;
  transform: translateX(-50%);
  background: radial-gradient(ellipse 50% 70%, rgba(94,234,212,0.06), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

#app {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px 20px 96px;
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* ═══════════════════════════════════════════
   HEADER PERSISTANT
   ═══════════════════════════════════════════ */

.sc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.sc-brand { display: flex; align-items: center; gap: 8px; }
.sc-logo-svg { width: 18px; height: 18px; fill: var(--accent); }
.sc-title { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; color: var(--text); display: flex; align-items: center; }
.sc-title-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin-left: 6px; box-shadow: 0 0 8px var(--accent); animation: sc-dotPulse 2s ease infinite; }
@keyframes sc-dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.sc-count { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-g); border: 1px solid rgba(94,234,212,0.2); padding: 2px 8px; border-radius: 12px; font-variant-numeric: tabular-nums; }
.sc-header-actions { display: flex; gap: 6px; }

.sc-icon-btn {
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text-2); cursor: pointer; transition: all 0.2s var(--ease);
}
.sc-icon-btn:hover { background: var(--surface-h); border-color: var(--border-h); color: var(--text); }
.sc-icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

.sc-view-container { flex: 1; display: flex; flex-direction: column; }

/* ═══════════════════════════════════════════
   UNIFIED SEGMENTED DOCK BAR
   ═══════════════════════════════════════════ */

.sc-dock {
  position: fixed;
  bottom: calc(16px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  padding: 4px;
  background: rgba(14, 16, 20, 0.92);
  -webkit-backdrop-filter: blur(24px);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 20px;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.4);
  z-index: 90;
  width: calc(100% - 32px);
  max-width: 400px;
  gap: 4px;
}

.sc-dock-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 10px;
  background: transparent;
  border: none;
  border-radius: 14px;
  color: var(--text-2);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  white-space: nowrap;
}

.sc-dock-btn svg { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }
.sc-dock-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
.sc-dock-btn.is-active { color: var(--text); background: rgba(255, 255, 255, 0.10); font-weight: 600; }
.sc-dock-btn.is-active svg { fill: var(--accent); }

.sc-dock-primary { background: var(--accent) !important; color: #07080a !important; font-weight: 600 !important; }
.sc-dock-primary svg { fill: #07080a !important; }
.sc-dock-primary:hover { background: var(--accent-2) !important; box-shadow: 0 0 16px rgba(94, 234, 212, 0.35); }
.sc-dock-primary.is-scanning svg { animation: sc-spin 0.8s linear infinite; }
@keyframes sc-spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════
   CARTE RADAR SOMBRE INTERACTIVE (Leaflet)
   ═══════════════════════════════════════════ */

.sc-map-container {
  width: 100%; height: 460px; border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border); position: relative; background: #07080a;
  z-index: 1; /* Locked low z-index */
}

.sc-map-user-marker { position: relative; }
.sc-user-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); border: 2px solid #07080a; }
.sc-user-pulse { position: absolute; inset: -8px; border-radius: 50%; border: 1px solid var(--accent); animation: sc-ringPulse 2s ease-out infinite; }

.sc-map-ac-wrapper { position: relative; cursor: pointer; }
.sc-ac-marker { transition: transform 0.3s ease; display: flex; align-items: center; justify-content: center; }
.sc-ac-label { font-family: var(--mono); font-size: 9px; font-weight: 600; color: #fff; background: rgba(7,8,10,0.85); padding: 1px 4px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.1); white-space: nowrap; margin-top: 2px; text-align: center; font-variant-numeric: tabular-nums; }

.sc-target-ring-marker { position: relative; }
.sc-target-ring { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); animation: sc-ringPulse 1.5s ease-out infinite; box-shadow: 0 0 20px var(--accent); }

.sc-map-overlay-banner {
  margin-top: 10px; padding: 8px 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-family: var(--mono); font-size: 11px; color: var(--text-2); text-align: center;
}

/* ═══════════════════════════════════════════
   FIX DES CARDS & CHIFFRES — Tabular Numerics
   ═══════════════════════════════════════════ */

.sc-list { display: flex; flex-direction: column; gap: 10px; }

.sc-card {
  position: relative; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; opacity: 0; transform: translateY(8px);
  transition: all 0.25s var(--ease); cursor: pointer; overflow: hidden;
}
.sc-card:hover { background: var(--bg-card-h); border-color: var(--border-h); }
.sc-card-in { opacity: 1; transform: translateY(0); }

.sc-aud-tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; }
.sc-aud-tag-dot { width: 5px; height: 5px; border-radius: 50%; }
.sc-aud-tag.high { color: var(--green); background: var(--green-bg); }
.sc-aud-tag.high .sc-aud-tag-dot { background: var(--green); }
.sc-aud-tag.medium { color: var(--yellow); background: var(--yellow-bg); }
.sc-aud-tag.medium .sc-aud-tag-dot { background: var(--yellow); }
.sc-aud-tag.low { color: var(--orange); background: var(--orange-bg); }
.sc-aud-tag.low .sc-aud-tag-dot { background: var(--orange); }

.sc-card-identity { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; min-width: 0; }
.sc-id-left { flex: 1; min-width: 0; overflow: hidden; }
.sc-id-right { text-align: right; flex-shrink: 0; min-width: 0; max-width: 45%; }

.sc-model { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-manufacturer { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.sc-operator { font-size: 12px; color: var(--text-2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-callsign { font-family: var(--mono); font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

.sc-card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-radius: var(--radius-xs); overflow: hidden; margin-bottom: 10px; }
.sc-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; background: var(--bg-elevated); }
.sc-cell-label { font-family: var(--mono); font-size: 9px; color: var(--text-4); letter-spacing: 1px; }
.sc-cell-val { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: 0; }

.sc-card-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.sc-tag { font-family: var(--mono); font-size: 10px; color: var(--text-4); padding: 2px 6px; background: var(--surface); border-radius: 4px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.sc-tag-action { margin-left: auto; color: var(--accent); background: var(--accent-g); font-weight: 500; }

/* ═══════════════════════════════════════════
   FICHE PASSIONNÉ D'AVIATION (Detail Sheet) — High Z-Index Isolation
   ═══════════════════════════════════════════ */

.sc-sheet-detail { max-height: 88vh; }
.sc-detail-header-info { display: flex; flex-direction: column; gap: 2px; }
.sc-detail-sub { font-size: 11px; color: var(--accent); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

.sc-photo-card {
  width: 100%; height: 180px; border-radius: var(--radius-sm); overflow: hidden;
  background: var(--bg-elevated); border: 1px solid var(--border); position: relative; margin-bottom: 14px;
}
.sc-ac-img { width: 100%; height: 100%; object-fit: cover; }
.sc-photo-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-3); font-size: 12px; gap: 6px; text-align: center; padding: 20px; }

.sc-blueprint-card { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: radial-gradient(circle at center, rgba(94,234,212,0.08), transparent 70%); position: relative; padding: 16px; text-align: center; }
.sc-blueprint-svg { width: 90px; height: 50px; margin-bottom: 8px; }
.sc-blueprint-text { display: flex; flex-direction: column; gap: 2px; }
.sc-blueprint-title { font-size: 13px; font-weight: 600; color: var(--text); }
.sc-blueprint-sub { font-family: var(--mono); font-size: 10px; color: var(--accent); font-variant-numeric: tabular-nums; }

.sc-detail-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.sc-metric-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; display: flex; flex-direction: column; gap: 4px; text-align: center; }
.sc-metric-title { font-family: var(--mono); font-size: 9px; color: var(--text-4); letter-spacing: 1px; }
.sc-metric-val { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.sc-metric-sub { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; letter-spacing: 0; }

.sc-detail-row { display: flex; justify-content: space-between; padding: 10px 12px; background: var(--surface); border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 12px; }
.sc-row-label { color: var(--text-3); }
.sc-row-val { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

.sc-specs-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; }
.sc-specs-title { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.sc-specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sc-spec-item { display: flex; flex-direction: column; gap: 2px; }
.sc-spec-lbl { font-size: 10px; color: var(--text-4); }
.sc-spec-val { font-size: 11px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }

.sc-tech-card { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; background: var(--bg-elevated); border-radius: var(--radius-sm); margin-bottom: 16px; }
.sc-tech-item { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--text-3); }
.sc-tech-item strong { font-family: var(--mono); color: var(--text); font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: 0; }

.sc-detail-actions { display: flex; flex-direction: column; gap: 8px; }

/* ═══════════════════════════════════════════
   MODAL STACKING CONTEXT — 100% Solid Backdrop & Full Screen Detail Sheet
   ═══════════════════════════════════════════ */

.sc-sheet-backdrop {
  position: fixed; inset: 0;
  background: #07080a;
  opacity: 0; pointer-events: none; transition: opacity 0.3s var(--ease);
  z-index: 1999;
}
.sc-sheet-backdrop.is-open { opacity: 1; pointer-events: auto; }

.sc-sheet {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 480px; background: #07080a;
  border: none;
  padding: 12px 20px 32px; transition: transform 0.35s var(--ease);
  z-index: 2000;
  max-height: 92vh; display: flex; flex-direction: column;
  box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.9);
}
.sc-sheet.is-open { transform: translateX(-50%) translateY(0); }

.sc-sheet-detail {
  top: 0; max-height: 100vh; height: 100vh; height: 100dvh;
  padding-top: max(16px, env(safe-area-inset-top));
  border-radius: 0 !important;
}

.sc-sheet-handle {
  width: 36px; height: 4px; background: rgba(255, 255, 255, 0.2);
  border-radius: 2px; margin: 0 auto 12px; flex-shrink: 0;
}

.sc-sheet-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.sc-sheet-title { font-size: 16px; font-weight: 700; color: var(--text); }
.sc-sheet-close { background: none; border: none; color: var(--text-3); font-size: 18px; cursor: pointer; padding: 2px 6px; }
.sc-sheet-body { overflow-y: auto; display: flex; flex-direction: column; }

/* ═══════════════════════════════════════════
   LOADING / EMPTY
   ═══════════════════════════════════════════ */

.sc-loading { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 40px 0; }
.sc-radar { position: relative; width: 140px; height: 140px; }
.sc-radar-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(94,234,212,0.15); }
.sc-ring-1 { inset: 35%; animation: sc-ringPulse 3s var(--ease-out) infinite; }
.sc-ring-2 { inset: 17%; animation: sc-ringPulse 3s var(--ease-out) 0.6s infinite; }
.sc-ring-3 { inset: 0;   animation: sc-ringPulse 3s var(--ease-out) 1.2s infinite; }

.sc-radar-sweep { position: absolute; inset: 0; border-radius: 50%; animation: sc-sweep 2.2s linear infinite; background: conic-gradient(from 0deg, transparent 0deg, transparent 340deg, rgba(94,234,212,0.25) 355deg, rgba(94,234,212,0.05) 360deg); }
.sc-radar-dot { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 12px var(--accent); }
.sc-radar-blip { position: absolute; width: 4px; height: 4px; background: var(--accent); border-radius: 50%; opacity: 0; animation: sc-blip 2.2s var(--ease) infinite; }
.sc-blip-1 { top: 25%; left: 60%; animation-delay: 0.3s; }
.sc-blip-2 { top: 40%; left: 78%; animation-delay: 1.1s; }
.sc-blip-3 { top: 68%; left: 35%; animation-delay: 1.7s; }

@keyframes sc-ringPulse { 0% { opacity: 0.5; transform: scale(0.92); } 100% { opacity: 0; transform: scale(1.3); } }
@keyframes sc-sweep { to { transform: rotate(360deg); } }
@keyframes sc-blip { 0%, 20% { opacity: 0; } 30%, 70% { opacity: 1; } 100% { opacity: 0; } }

.sc-meta { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.sc-meta-sep { width: 3px; height: 3px; background: var(--text-4); border-radius: 50%; }
.sc-meta-accent { color: var(--text-2); }

.sc-empty, .sc-error { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 30px 10px; }
.sc-empty-visual { position: relative; width: 64px; height: 64px; }
.sc-empty-circle { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed var(--text-4); }
.sc-empty-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; opacity: 0.3; }
.sc-empty-title, .sc-error-title { font-size: 16px; font-weight: 600; }
.sc-empty-body, .sc-error-desc { font-size: 13px; color: var(--text-2); max-width: 320px; line-height: 1.6; }
.sc-empty-reasons { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 320px; text-align: left; }
.sc-reason { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; color: var(--text-2); }
.sc-empty-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 280px; margin-top: 10px; }

.sc-btn { padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--sans); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.sc-btn:hover { background: var(--surface-h); border-color: var(--border-h); }
.sc-btn-lg { padding: 12px 20px; font-size: 13px; border-radius: var(--radius); }
.sc-btn-danger { color: var(--red); border-color: rgba(248,113,113,0.2); }

.sc-setting-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.sc-setting-label { font-size: 12px; font-weight: 500; color: var(--text-2); }
.sc-pill-selector { display: flex; gap: 6px; flex-wrap: wrap; }
.sc-pill-opt { flex: 1; min-width: 90px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-3); font-size: 12px; cursor: pointer; text-align: center; transition: all 0.2s; font-variant-numeric: tabular-nums; }
.sc-pill-opt.is-active { background: var(--accent-g); border-color: var(--accent); color: var(--accent); font-weight: 600; }

.sc-history-item { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--surface); border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 8px; }
.sc-history-item:hover { background: var(--surface-h); }
